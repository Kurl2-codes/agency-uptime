version: '3.8'

services:
  uptime-kuma:
    build:
      context: ./uptime-kuma
      dockerfile: Dockerfile
    volumes:
      - agency-uptime-data:/app/data
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - MCP_AGENT_URL=http://mcp-agent:8000/chat
    networks:
      - agency-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-monitoring:
    build:
      context: ./mcp-monitoring
    env_file:
      - ./mcp-monitoring/.env
    container_name: mcp-agent
    volumes:
      - mcp-logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      uptime-kuma:
        condition: service_started
    networks:
      - agency-network
    restart: unless-stopped

networks:
  agency-network:
    driver: bridge

volumes:
  agency-uptime-data:
  mcp-logs:
